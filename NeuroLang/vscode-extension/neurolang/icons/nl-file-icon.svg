<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <!-- tlo -->
  <rect width="128" height="128" rx="18" fill="#12082e"/>
  <rect width="128" height="128" rx="18" fill="none" stroke="#4c1d95" stroke-width="1"/>

  <!-- polaczenia wejscie -> ukryta -->
  <line x1="20" y1="42" x2="64" y2="28"  stroke="#5b21b6" stroke-width="1.2" opacity="0.9"/>
  <line x1="20" y1="42" x2="64" y2="64"  stroke="#5b21b6" stroke-width="1.2" opacity="0.7"/>
  <line x1="20" y1="42" x2="64" y2="100" stroke="#5b21b6" stroke-width="1.2" opacity="0.35"/>
  <line x1="20" y1="86" x2="64" y2="28"  stroke="#5b21b6" stroke-width="1.2" opacity="0.35"/>
  <line x1="20" y1="86" x2="64" y2="64"  stroke="#5b21b6" stroke-width="1.2" opacity="0.7"/>
  <line x1="20" y1="86" x2="64" y2="100" stroke="#5b21b6" stroke-width="1.2" opacity="0.9"/>

  <!-- polaczenia ukryta -> wyjscie -->
  <line x1="64" y1="28"  x2="108" y2="64" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
  <line x1="64" y1="64"  x2="108" y2="64" stroke="#8b5cf6" stroke-width="2"   opacity="1"/>
  <line x1="64" y1="100" x2="108" y2="64" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>

  <!-- neurony wejsciowe -->
  <circle cx="20" cy="42" r="6.5" fill="#3b0764" stroke="#7c3aed" stroke-width="1.8"/>
  <circle cx="20" cy="86" r="6.5" fill="#3b0764" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- neurony ukryte -->
  <circle cx="64" cy="28"  r="6.5" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.8"/>
  <circle cx="64" cy="64"  r="6.5" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.8"/>
  <circle cx="64" cy="100" r="6.5" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.8"/>

  <!-- neuron wyjsciowy (aktywny) -->
  <circle cx="108" cy="64" r="9"   fill="#6d28d9" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="108" cy="64" r="4"   fill="#c4b5fd"/>

  <!-- label -->
  <text x="64" y="119" text-anchor="middle"
        font-family="monospace" font-size="11" font-weight="700"
        fill="#c4b5fd" letter-spacing="3">.nl</text>
</svg>